name: Build Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update.
        required: true
        default: v0.0.1-beta
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.2"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python parser dependencies
        run: python -m pip install --upgrade pip pypdf

      - name: Install Trivy
        shell: powershell
        run: |
          winget install --id AquaSecurity.Trivy --exact --silent --accept-source-agreements --accept-package-agreements
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machinePath;$userPath;$env:LOCALAPPDATA\Microsoft\WinGet\Links;$env:Path"
          trivy --version

      - name: Run full release check
        shell: powershell
        run: npm run release:check

      - name: Build Windows installer
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  build-macos:
    name: macOS DMG and ZIP
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python parser dependencies
        run: python -m pip install --upgrade pip pypdf

      - name: Install Trivy
        run: brew install aquasecurity/trivy/trivy

      - name: Run syntax checks
        run: npm run check:syntax

      - name: Compile Python helpers
        run: python -m py_compile scripts/*.py

      - name: Run unit tests
        run: npm test

      - name: Run dependency audit
        run: npm run audit:deps

      - name: Run secret scan
        run: npm run secret:scan

      - name: Build renderer
        run: npm run build

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
            --exit-code 1 \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs node_modules \
            --skip-dirs dist \
            --skip-dirs release \
            --skip-dirs .git \
            --skip-dirs .tools \
            --skip-dirs .smoke-data-release \
            --skip-dirs .smoke-data-user \
            .

      - name: Build macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  draft-release:
    name: Create draft GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          previous_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          {
            echo "## AMERP ${RELEASE_TAG}"
            echo
            echo "Draft beta release. Review installers, metadata files, and update behavior before publishing."
            echo
            if [ -n "$previous_tag" ]; then
              echo "### Commits since ${previous_tag}"
              git log --pretty=format:'- %s (%h)' "${previous_tag}..HEAD"
            else
              echo "### Commits"
              git log --pretty=format:'- %s (%h)'
            fi
          } > release-notes.md

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: AMERP ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: true
          prerelease: true
          files: artifacts/**/*
