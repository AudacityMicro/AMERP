name: Build Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update.
        required: true
        default: v0.0.1-beta
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.2"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python parser dependencies
        run: python -m pip install --upgrade pip pypdf

      - name: Install Trivy
        shell: powershell
        run: |
          winget install --id AquaSecurity.Trivy --exact --silent --accept-source-agreements --accept-package-agreements
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machinePath;$userPath;$env:LOCALAPPDATA\Microsoft\WinGet\Links;$env:Path"
          trivy --version

      - name: Run full release check
        shell: powershell
        run: npm run release:check

      - name: Smoke test source installer
        shell: powershell
        run: >
          npm run smoke:install:source:win --
          -RepoZipUrl "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip"

      - name: Build Windows installer
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Smoke test packaged installer
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows installer was produced under release/."
          }
          npm run smoke:install:packaged:win -- -InstallerPath $installer.FullName

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  build-macos:
    name: macOS DMG and ZIP (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python parser dependencies
        run: python -m pip install --upgrade pip pypdf

      - name: Install Trivy
        run: brew install aquasecurity/trivy/trivy

      - name: Run syntax checks
        run: npm run check:syntax

      - name: Compile Python helpers
        run: python -m py_compile scripts/*.py

      - name: Run unit tests
        run: npm test

      - name: Run dependency audit
        run: npm run audit:deps

      - name: Run secret scan
        run: npm run secret:scan

      - name: Build renderer
        run: npm run build

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
            --exit-code 1 \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs node_modules \
            --skip-dirs dist \
            --skip-dirs release \
            --skip-dirs .git \
            --skip-dirs .tools \
            --skip-dirs .smoke-data-release \
            --skip-dirs .smoke-data-user \
            .

      - name: Build macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:mac:${{ matrix.arch }}

      - name: Smoke test macOS packaged app
        run: |
          artifact="$(find release -maxdepth 1 -name '*-mac-${{ matrix.arch }}.zip' -print -quit)"
          if [ -z "$artifact" ]; then
            artifact="$(find release -maxdepth 1 -name '*-mac-${{ matrix.arch }}.dmg' -print -quit)"
          fi
          if [ -z "$artifact" ]; then
            echo "No macOS ${{ matrix.arch }} DMG or ZIP artifact was produced under release/." >&2
            exit 1
          fi
          npm run smoke:install:packaged:mac -- --artifact "$artifact"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap

  build-linux:
    name: Linux AppImage and DEB
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libatk-bridge2.0-0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python parser dependencies
        run: python -m pip install --upgrade pip pypdf

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run syntax checks
        run: npm run check:syntax

      - name: Compile Python helpers
        run: python -m py_compile scripts/*.py

      - name: Run unit tests
        run: npm test

      - name: Run dependency audit
        run: npm run audit:deps

      - name: Run secret scan
        run: npm run secret:scan

      - name: Build renderer
        run: npm run build

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
            --exit-code 1 \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs node_modules \
            --skip-dirs dist \
            --skip-dirs release \
            --skip-dirs .git \
            --skip-dirs .tools \
            --skip-dirs .smoke-data-release \
            --skip-dirs .smoke-data-user \
            .

      - name: Build Linux artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:linux

      - name: Smoke test Linux packaged app
        run: |
          artifact="$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [ -z "$artifact" ]; then
            artifact="$(find release -maxdepth 1 -name '*.deb' -print -quit)"
          fi
          if [ -z "$artifact" ]; then
            echo "No Linux AppImage or DEB artifact was produced under release/." >&2
            exit 1
          fi
          npm run smoke:install:packaged:linux -- --artifact "$artifact"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux.yml

  draft-release:
    name: Create draft GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          previous_tag="$(git tag --sort=-version:refname --merged HEAD --list 'v*' | grep -v "^${RELEASE_TAG}$" | head -n 1 || true)"
          {
            echo "## AMERP ${RELEASE_TAG}"
            echo
            echo "Draft beta release. Review installers, metadata files, and update behavior before publishing."
            echo
            if [ -n "$previous_tag" ]; then
              echo "### Commits since ${previous_tag}"
              git log --pretty=format:'- %s (%h)' "${previous_tag}..HEAD"
            else
              echo "### Commits"
              git log --pretty=format:'- %s (%h)'
            fi
          } > release-notes.md

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: AMERP ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: true
          prerelease: true
          files: artifacts/**/*
